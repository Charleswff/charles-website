<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Zarva Dashboard</title>
    <style>
        :root {
            --ac-primary: #0071e3;
            --ac-text: #1d1d1f;
            --ac-text-secondary: #86868b;
            --ac-bg: #f5f5f7;
            --ac-glass: rgba(255, 255, 255, 0.72);
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--ac-bg);
            color: var(--ac-text);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* 顶部导航 - 通栏毛玻璃 */
        .navbar {
            position: relative;
            height: 52px;
            width: 100%;
            background: var(--ac-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            z-index: 100;
        }

        /* 标题 - 绝对定位居左 */
        .nav-title {
            position: absolute;
            left: 20px;
            font-size: 17px;
            font-weight: 600;
            letter-spacing: -0.022em;
            color: var(--ac-text);
        }

        /* 菜单项 - 绝对居中 */
        .nav-tabs {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            height: 100%;
        }

        /* 菜单仅含纯文本，无 Emoji */
        .tab-item {
            position: relative;
            padding: 0 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 400;
            color: var(--ac-text-secondary);
            display: flex;
            align-items: center;
            transition: color 0.2s ease;
            height: 100%;
        }

        .tab-item:hover {
            color: var(--ac-text);
        }

        .tab-item.active {
            color: var(--ac-text);
            font-weight: 600;
        }

        /* 选中状态底部黑线条 */
        .tab-item.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: #1d1d1f;
        }

        .content-container {
            flex: 1;
            position: relative;
            width: 100%;
            height: calc(100vh - 52px);
        }

        .tab-content {
            display: none;
            width: 100%;
            height: 100%;
        }

        .tab-content.active {
            display: block;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #ffffff;
        }
    </style>
</head>

    <script>
        function switchTab(index) {
            document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            
            document.querySelectorAll('.tab-item')[index].classList.add('active');
            document.getElementById('tab-' + index).classList.add('active');
        }
